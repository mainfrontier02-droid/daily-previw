<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ari Daily Spin</title>
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(168,85,247,.28) 0%,transparent 45%),
    radial-gradient(circle at 100% 100%,rgba(255,215,0,.15) 0%,transparent 50%),
    radial-gradient(circle at 0% 100%,rgba(34,211,238,.12) 0%,transparent 50%),
    linear-gradient(180deg,#05030a 0%,#0a0518 50%,#000 100%);
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color:#f5f3ff;
  touch-action:manipulation;
  overflow-x:hidden;
  padding:18px;
}
.box{width:100%;max-width:640px;margin:auto;position:relative}

.card{
  position:relative;
  background:linear-gradient(160deg,rgba(30,15,60,.78),rgba(10,5,25,.94));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(168,85,247,.3);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,.75),0 0 120px rgba(168,85,247,.08) inset,0 0 60px rgba(255,215,0,.05);
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:24px;padding:1px;
  background:linear-gradient(135deg,rgba(255,215,0,.6),rgba(168,85,247,.4) 35%,rgba(34,211,238,.3) 65%,transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}

.header{
  position:relative;padding:22px 24px 18px;
  border-bottom:1px solid rgba(168,85,247,.15);
  background:linear-gradient(90deg,rgba(168,85,247,.07),transparent);
}
.eyebrow{font-size:10px;letter-spacing:4px;color:rgba(255,215,0,.75);font-weight:800;text-transform:uppercase}
.title{
  font-size:28px;font-weight:900;letter-spacing:.5px;margin-top:6px;
  background:linear-gradient(90deg,#ffd700 0%,#f5f3ff 40%,#a855f7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 14px rgba(255,215,0,.3));
}
.sub{font-size:11px;color:rgba(245,243,255,.45);margin-top:4px;letter-spacing:1px}

.machine{padding:22px 20px 10px}
.reels{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;
  background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(10,5,25,.9));
  border:2px solid rgba(255,215,0,.4);
  border-radius:20px;
  box-shadow:0 0 70px rgba(255,215,0,.18) inset,0 8px 40px rgba(0,0,0,.65);
}
.reel{
  position:relative;height:120px;border-radius:12px;
  background:linear-gradient(180deg,rgba(20,10,40,.95),rgba(0,0,0,.95));
  border:1px solid rgba(168,85,247,.4);
  overflow:hidden;
  box-shadow:0 0 24px rgba(0,0,0,.5) inset;
}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:24px;pointer-events:none;z-index:2}
.reel::before{top:0;background:linear-gradient(180deg,rgba(10,5,25,.95),transparent)}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(10,5,25,.95),transparent)}
.strip{position:absolute;top:0;left:0;right:0;will-change:transform}
.sym{height:120px;display:flex;align-items:center;justify-content:center;padding:14px}
.sym svg{width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}

.spin-wrap{padding:22px 20px 8px;display:flex;justify-content:center}
.spin-btn{
  position:relative;
  width:210px;height:62px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#ffd700,#a855f7 55%,#22d3ee);
  color:#0a0518;font-size:16px;font-weight:900;letter-spacing:4px;
  cursor:pointer;font-family:inherit;text-transform:uppercase;
  box-shadow:0 12px 40px rgba(255,215,0,.5),0 0 30px rgba(168,85,247,.4);
  transition:all .15s ease;overflow:hidden;
}
.spin-btn::before{
  content:"";position:absolute;inset:2px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%);
  pointer-events:none;
}
.spin-btn:active{transform:scale(.96)}
.spin-btn:disabled{opacity:.55;cursor:not-allowed}
.spin-btn.spinning{animation:btnPulse 1s ease-in-out infinite}
@keyframes btnPulse{
  0%,100%{box-shadow:0 12px 40px rgba(255,215,0,.5),0 0 30px rgba(168,85,247,.4)}
  50%{box-shadow:0 12px 60px rgba(255,215,0,.85),0 0 60px rgba(168,85,247,.7)}
}

.status{padding:8px 20px 24px;display:flex;justify-content:center}
.status-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 16px;border-radius:99px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(168,85,247,.35);
  font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(245,243,255,.7);
  transition:all .3s;
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:#a855f7;box-shadow:0 0 10px currentColor}
.status-pill.ready{border-color:rgba(255,215,0,.65);color:#ffd700}
.status-pill.ready .dot{background:#ffd700}
.status-pill.spinning{border-color:rgba(168,85,247,.75);color:#c4b5fd}
.status-pill.spinning .dot{background:#c4b5fd;animation:blink .6s infinite}
.status-pill.won{border-color:rgba(34,197,94,.75);color:#22c55e}
.status-pill.won .dot{background:#22c55e}
.status-pill.lost{border-color:rgba(239,68,68,.75);color:#ef4444}
.status-pill.lost .dot{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;
  animation:fadeIn .35s ease;
}
.overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.ov-card{
  background:linear-gradient(160deg,rgba(40,20,70,.98),rgba(10,5,25,.99));
  border:1px solid rgba(255,215,0,.6);
  border-radius:24px;padding:28px 24px;
  max-width:400px;width:100%;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.9),0 0 80px rgba(255,215,0,.3);
  animation:pop .4s cubic-bezier(.5,1.6,.5,1);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.ov-title{font-size:22px;font-weight:900;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 20px rgba(255,215,0,.7)}
.ov-title.win{color:#22c55e}
.ov-title.lose{color:#ef4444}
.ov-sub{font-size:10px;letter-spacing:3px;color:rgba(245,243,255,.5);font-weight:700;margin-bottom:22px;text-transform:uppercase}
.ov-reward{
  font-size:42px;font-weight:900;color:#ffd700;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 28px rgba(255,215,0,.8);
  margin:10px 0 24px;
}
.ov-reward.zero{color:#6b7280;text-shadow:none;font-size:28px}
.ov-label{font-size:9px;letter-spacing:4px;color:rgba(34,211,238,.9);font-weight:800;margin-bottom:10px;text-transform:uppercase}
.ov-cmd{
  background:rgba(0,0,0,.75);
  border:2px solid rgba(34,211,238,.6);
  border-radius:14px;padding:16px 12px;
  font-family:'JetBrains Mono','Courier New',monospace;
  font-size:17px;font-weight:900;color:#22d3ee;letter-spacing:3px;
  user-select:all;-webkit-user-select:all;
  margin-bottom:12px;
  text-shadow:0 0 12px rgba(34,211,238,.8);
  word-break:break-all;
}
.ov-ttl{font-size:11px;color:rgba(245,243,255,.65);margin-bottom:18px;font-weight:700}
.ov-ttl b{color:#ffd700;font-size:14px;text-shadow:0 0 10px rgba(255,215,0,.6)}
.ov-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#ffd700,#a855f7);
  border:none;border-radius:14px;padding:15px 20px;
  color:#0a0518;font-size:13px;font-weight:900;
  cursor:pointer;font-family:inherit;
  letter-spacing:2px;text-transform:uppercase;
  box-shadow:0 8px 28px rgba(255,215,0,.5);
  transition:all .15s ease;
}
.ov-btn:active{transform:scale(.96)}
.ov-btn.copied{background:linear-gradient(135deg,#22c55e,#22d3ee);color:#fff}
.ov-btn:disabled{background:linear-gradient(135deg,#333,#222);color:#666;box-shadow:none;cursor:not-allowed}
.ov-hint{font-size:10px;color:rgba(245,243,255,.45);margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<div class="box">
  <div class="card">
    <div class="header">
      <div class="eyebrow">Ari Arcade</div>
      <div class="title">DAILY SPIN</div>
      <div class="sub">Try your luck once a day</div>
    </div>

    <div class="machine">
      <div class="reels">
        <div class="reel"><div class="strip" id="s0"></div></div>
        <div class="reel"><div class="strip" id="s1"></div></div>
        <div class="reel"><div class="strip" id="s2"></div></div>
      </div>
    </div>

    <div class="spin-wrap">
      <button class="spin-btn" id="spinBtn">SPIN</button>
    </div>

    <div class="status">
      <div class="status-pill ready" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden">
  <div class="ov-card">
    <div class="ov-title" id="ovTitle">RESULT</div>
    <div class="ov-sub" id="ovSub">Ari Daily</div>
    <div class="ov-reward" id="ovReward">+0</div>
    <div class="ov-label">Copy This Command</div>
    <div class="ov-cmd" id="ovCmd">.claim ------</div>
    <div class="ov-ttl">Expires in <b id="ovTtl">0</b>s</div>
    <button class="ov-btn" id="ovCopy">COPY COMMAND</button>
    <div class="ov-hint">Paste it in chat and send. Coins go straight to your wallet.</div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   SHARED SECRET — must match the bot's DAILY_SECRET value
   ============================================================ */
var SECRET = "ari-daily-2026-xitexe-frontier";

var SYM = {
  seven:   '<svg viewBox="0 0 100 100"><defs><linearGradient id="g7" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff8b8"/><stop offset="1" stop-color="#ffb800"/></linearGradient></defs><text x="50" y="78" text-anchor="middle" font-size="86" font-weight="900" font-family="Arial Black,Arial" fill="url(#g7)" stroke="#7a4f00" stroke-width="2">7</text></svg>',
  diamond: '<svg viewBox="0 0 100 100"><defs><linearGradient id="gd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs><polygon points="50,8 92,50 50,92 8,50" fill="url(#gd)" stroke="#fff" stroke-width="2"/></svg>',
  star:    '<svg viewBox="0 0 100 100"><defs><linearGradient id="gs" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset="1" stop-color="#9333ea"/></linearGradient></defs><polygon points="50,6 61,38 96,38 68,60 79,94 50,73 21,94 32,60 4,38 39,38" fill="url(#gs)" stroke="#fff" stroke-width="1.5"/></svg>',
  bell:    '<svg viewBox="0 0 100 100"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs><path d="M50 8 Q28 8 28 42 L18 72 L82 72 L72 42 Q72 8 50 8 Z M40 78 Q40 94 50 94 Q60 94 60 78 Z" fill="url(#gb)" stroke="#7a4f00" stroke-width="2"/></svg>',
  clover:  '<svg viewBox="0 0 100 100"><circle cx="34" cy="34" r="21" fill="#22c55e" stroke="#0a3a1a" stroke-width="2"/><circle cx="66" cy="34" r="21" fill="#22c55e" stroke="#0a3a1a" stroke-width="2"/><circle cx="34" cy="66" r="21" fill="#22c55e" stroke="#0a3a1a" stroke-width="2"/><circle cx="66" cy="66" r="21" fill="#22c55e" stroke="#0a3a1a" stroke-width="2"/><rect x="46" y="46" width="8" height="42" fill="#16a34a" stroke="#0a3a1a" stroke-width="2"/></svg>'
};
var KEYS = ["seven","diamond","star","bell","clover"];
var SYM_H = 120;
var BUCKET_MS = 30000;

function rotCode(reward){
  var bucket = Math.floor(Date.now() / BUCKET_MS);
  var str = SECRET + ":" + bucket + ":" + reward;
  var h = 0x811c9dc5 >>> 0;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return String(h % 1000000).padStart(6, "0");
}

function pickSymbol(){
  var r = Math.random();
  if (r < 0.05) return "seven";
  if (r < 0.15) return "diamond";
  if (r < 0.30) return "star";
  if (r < 0.55) return "bell";
  return "clover";
}

function computePrize(s){
  if (s[0] === s[1] && s[1] === s[2]) {
    return {seven:1000, diamond:500, star:250, bell:150, clover:100}[s[0]];
  }
  if (s[0] === s[1] || s[1] === s[2] || s[0] === s[2]) return 50;
  return 0;
}

function fillStrip(el, count){
  var html = "";
  for (var i = 0; i < count; i++) {
    var k = KEYS[Math.floor(Math.random() * KEYS.length)];
    html += '<div class="sym">' + SYM[k] + '</div>';
  }
  el.innerHTML = html;
}

function spinReel(el, target, durationMs){
  var spins = 18;
  var html = "";
  for (var i = 0; i < spins; i++) {
    var k = KEYS[Math.floor(Math.random() * KEYS.length)];
    html += '<div class="sym">' + SYM[k] + '</div>';
  }
  html += '<div class="sym">' + SYM[target] + '</div>';
  el.innerHTML = html;
  el.style.transition = "none";
  el.style.transform = "translateY(0)";
  el.offsetHeight;
  el.style.transition = "transform " + durationMs + "ms cubic-bezier(.15,.65,.2,1)";
  el.style.transform = "translateY(-" + (spins * SYM_H) + "px)";
}

var s0 = document.getElementById("s0");
var s1 = document.getElementById("s1");
var s2 = document.getElementById("s2");
var spinBtn = document.getElementById("spinBtn");
var statusEl = document.getElementById("status");
var statusText = document.getElementById("statusText");
var overlay = document.getElementById("overlay");
var ovTitle = document.getElementById("ovTitle");
var ovSub = document.getElementById("ovSub");
var ovReward = document.getElementById("ovReward");
var ovCmd = document.getElementById("ovCmd");
var ovTtl = document.getElementById("ovTtl");
var ovCopy = document.getElementById("ovCopy");

var spinning = false;
var done = false;
var frozenCode = null;
var frozenAt = 0;

fillStrip(s0, 6);
fillStrip(s1, 6);
fillStrip(s2, 6);

function setStatus(text, cls){
  statusText.textContent = text;
  statusEl.className = "status-pill " + (cls || "");
}

spinBtn.addEventListener("click", function(){
  if (spinning || done) return;
  spinning = true;
  spinBtn.disabled = true;
  spinBtn.classList.add("spinning");
  spinBtn.textContent = "SPINNING";
  setStatus("Spinning", "spinning");

  var result = [pickSymbol(), pickSymbol(), pickSymbol()];

  spinReel(s0, result[0], 1600);
  spinReel(s1, result[1], 2000);
  spinReel(s2, result[2], 2400);

  setTimeout(function(){
    var prize = computePrize(result);
    frozenCode = rotCode(prize);
    frozenAt = Date.now();

    done = true;
    spinning = false;
    spinBtn.classList.remove("spinning");
    spinBtn.textContent = "SPIN USED";

    if (prize > 0) {
      setStatus("Winner!", "won");
    } else {
      setStatus("No win", "lost");
    }

    ovTitle.textContent = prize > 0 ? "YOU WON!" : "NO LUCK";
    ovTitle.className = "ov-title " + (prize > 0 ? "win" : "lose");
    ovReward.textContent = prize > 0 ? ("+" + prize) : "NOTHING";
    ovReward.className = "ov-reward" + (prize > 0 ? "" : " zero");
    ovCmd.textContent = ".claim " + frozenCode;

    setTimeout(function(){
      overlay.classList.remove("hidden");
    }, 400);

    var bucketStart = Math.floor(frozenAt / BUCKET_MS) * BUCKET_MS;
    var validUntil = bucketStart + BUCKET_MS * 3;

    (function tick(){
      var left = Math.max(0, Math.floor((validUntil - Date.now()) / 1000));
      ovTtl.textContent = left;
      if (left <= 0) {
        ovTtl.textContent = "0";
        ovCopy.disabled = true;
        ovCopy.textContent = "CODE EXPIRED";
        return;
      }
      setTimeout(tick, 500);
    })();
  }, 2600);
});

ovCopy.addEventListener("click", function(){
  if (!frozenCode) return;
  var cmd = ".claim " + frozenCode;
  var doneCb = function(){
    ovCopy.classList.add("copied");
    ovCopy.textContent = "COPIED!";
    setTimeout(function(){
      ovCopy.classList.remove("copied");
      ovCopy.textContent = "COPY COMMAND";
    }, 1800);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(doneCb).catch(function(){
        var ta = document.createElement("textarea");
        ta.value = cmd; ta.style.position = "fixed"; ta.style.top = "-9999px";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta); doneCb();
      });
    } else {
      var ta = document.createElement("textarea");
      ta.value = cmd; ta.style.position = "fixed"; ta.style.top = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); doneCb();
    }
  } catch(e){}
});
})();
</script>
</body>
</html>
