<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ari Daily Spin</title>
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(ellipse at 50% -20%,rgba(255,215,0,.18) 0%,transparent 40%),
    radial-gradient(circle at 50% -10%,rgba(168,85,247,.3) 0%,transparent 45%),
    radial-gradient(circle at 100% 100%,rgba(34,211,238,.12) 0%,transparent 50%),
    radial-gradient(circle at 0% 100%,rgba(236,72,153,.1) 0%,transparent 50%),
    linear-gradient(180deg,#05030a 0%,#0a0518 60%,#000 100%);
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color:#f5f3ff;touch-action:manipulation;padding:18px;
}
.box{width:100%;max-width:640px;margin:auto;position:relative}

/* ───── MACHINE FRAME ───── */
.machine{
  position:relative;
  border-radius:32px;
  padding:3px;
  background:linear-gradient(160deg,#f5d76e 0%,#b8860b 20%,#6b4400 45%,#b8860b 70%,#f5d76e 100%);
  box-shadow:
    0 30px 90px rgba(0,0,0,.85),
    0 0 140px rgba(255,215,0,.15),
    0 0 60px rgba(168,85,247,.12),
    inset 0 1px 0 rgba(255,255,255,.4);
}
.machine-inner{
  position:relative;
  border-radius:30px;
  padding:22px;
  background:
    radial-gradient(circle at 50% 0%,rgba(60,30,90,.95) 0%,rgba(15,8,30,.98) 50%,rgba(5,3,10,1) 100%);
  overflow:hidden;
}
.machine-inner::before{
  content:"";position:absolute;inset:0;border-radius:30px;
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 30%);
  pointer-events:none;
}

/* ───── MARQUEE LIGHTS ───── */
.marquee{
  position:absolute;inset:0;border-radius:30px;padding:8px;
  pointer-events:none;
}
.marquee .bulb{
  position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#fff8b8 0%,#ffd700 40%,#7a4f00 100%);
  box-shadow:0 0 8px rgba(255,215,0,.9),0 0 16px rgba(255,215,0,.4);
  animation:bulbBlink 2s ease-in-out infinite;
}
@keyframes bulbBlink{
  0%,100%{opacity:.35;box-shadow:0 0 4px rgba(255,215,0,.4)}
  50%{opacity:1;box-shadow:0 0 10px rgba(255,215,0,1),0 0 24px rgba(255,215,0,.6)}
}

/* ───── HEADER ───── */
.header{position:relative;text-align:center;padding:6px 0 18px;z-index:2}
.eyebrow{
  font-size:10px;letter-spacing:6px;font-weight:800;
  color:rgba(255,215,0,.85);
  text-transform:uppercase;
  text-shadow:0 0 12px rgba(255,215,0,.6);
}
.title{
  font-size:32px;font-weight:900;letter-spacing:1px;margin-top:8px;
  background:linear-gradient(180deg,#fff8b8 0%,#ffd700 30%,#b8860b 60%,#ffd700 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(255,215,0,.5)) drop-shadow(0 2px 0 rgba(0,0,0,.5));
  text-transform:uppercase;
}
.sub{
  font-size:10px;letter-spacing:4px;color:rgba(245,243,255,.5);
  margin-top:6px;font-weight:600;text-transform:uppercase;
}

/* ───── REELS CABINET ───── */
.cabinet{
  position:relative;padding:16px;border-radius:24px;
  background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(15,8,30,.95));
  border:2px solid rgba(255,215,0,.25);
  box-shadow:
    0 0 60px rgba(0,0,0,.7) inset,
    0 0 60px rgba(255,215,0,.1) inset,
    0 10px 40px rgba(0,0,0,.6);
  z-index:2;
}
.cabinet::before{
  content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;
  background:linear-gradient(180deg,rgba(255,215,0,.5),transparent 30%,transparent 70%,rgba(255,215,0,.3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}

/* ───── PAYLINE ───── */
.payline{
  position:absolute;left:16px;right:16px;top:50%;height:2px;
  transform:translateY(-1px);
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.7) 20%,rgba(255,215,0,1) 50%,rgba(255,215,0,.7) 80%,transparent);
  box-shadow:0 0 20px rgba(255,215,0,.8);
  z-index:5;pointer-events:none;opacity:.5;
  transition:opacity .3s;
}
.payline.active{opacity:1;animation:paylinePulse .6s ease-in-out infinite}
@keyframes paylinePulse{
  0%,100%{box-shadow:0 0 20px rgba(255,215,0,.8)}
  50%{box-shadow:0 0 40px rgba(255,215,0,1),0 0 60px rgba(255,215,0,.5)}
}

/* ───── REELS ───── */
.reels{
  position:relative;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.reel{
  position:relative;height:280px;border-radius:14px;
  background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(20,10,40,.9));
  border:1px solid rgba(255,215,0,.2);
  overflow:hidden;
  box-shadow:
    0 0 30px rgba(0,0,0,.8) inset,
    0 0 20px rgba(0,0,0,.5);
}
/* top + bottom shade */
.reel::before,.reel::after{
  content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:4;
}
.reel::before{
  top:0;height:70px;
  background:linear-gradient(180deg,rgba(5,3,10,.95) 0%,rgba(5,3,10,.6) 40%,transparent 100%);
}
.reel::after{
  bottom:0;height:70px;
  background:linear-gradient(0deg,rgba(5,3,10,.95) 0%,rgba(5,3,10,.6) 40%,transparent 100%);
}
/* glass sheen */
.reel-sheen{
  position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:14px;
  background:linear-gradient(115deg,
    rgba(255,255,255,.14) 0%,
    rgba(255,255,255,.05) 18%,
    transparent 40%,
    transparent 60%,
    rgba(255,255,255,.03) 82%,
    rgba(255,255,255,.08) 100%);
  mix-blend-mode:overlay;
}

.strip{
  position:absolute;top:0;left:0;right:0;
  will-change:transform,filter;
  transition:none;
}
.strip.spinning{filter:blur(0.6px)}
.strip.fast{filter:blur(2.5px)}

.sym{
  height:140px;display:flex;align-items:center;justify-content:center;padding:20px;
  position:relative;
}
.sym svg{width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
.sym.win svg{animation:symWin .7s ease-out}
@keyframes symWin{
  0%{transform:scale(1)}
  40%{transform:scale(1.18);filter:drop-shadow(0 0 30px rgba(255,215,0,1))}
  100%{transform:scale(1);filter:drop-shadow(0 6px 14px rgba(0,0,0,.7))}
}

/* ───── SPIN BUTTON ───── */
.spin-wrap{padding:24px 0 6px;display:flex;justify-content:center;z-index:2;position:relative}
.spin-btn{
  position:relative;
  width:220px;height:68px;border-radius:18px;border:none;
  background:linear-gradient(180deg,#ffe97a 0%,#ffd700 25%,#b8860b 60%,#6b4400 100%);
  color:#1a0d00;font-size:17px;font-weight:900;letter-spacing:6px;
  cursor:pointer;font-family:inherit;text-transform:uppercase;
  box-shadow:
    0 10px 30px rgba(255,215,0,.55),
    0 0 40px rgba(255,215,0,.3),
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -3px 0 rgba(0,0,0,.4);
  transition:transform .1s ease,box-shadow .2s ease;
  overflow:hidden;
}
.spin-btn::before{
  content:"";position:absolute;inset:4px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,transparent 50%);
  pointer-events:none;
}
.spin-btn::after{
  content:"";position:absolute;left:-60%;top:0;bottom:0;width:40%;
  background:linear-gradient(115deg,transparent,rgba(255,255,255,.7),transparent);
  transform:skewX(-20deg);
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{
  0%{left:-60%}
  50%,100%{left:160%}
}
.spin-btn:active{transform:translateY(2px) scale(.98)}
.spin-btn:disabled{
  background:linear-gradient(180deg,#4a4a4a 0%,#2a2a2a 100%);
  color:#888;cursor:not-allowed;
  box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.1);
}
.spin-btn.spinning{animation:btnPulse 0.9s ease-in-out infinite}
@keyframes btnPulse{
  0%,100%{box-shadow:0 10px 30px rgba(255,215,0,.55),0 0 40px rgba(255,215,0,.3)}
  50%{box-shadow:0 10px 40px rgba(255,215,0,.9),0 0 70px rgba(255,215,0,.6)}
}

/* ───── STATUS ───── */
.status{padding:14px 0 4px;display:flex;justify-content:center;z-index:2;position:relative}
.status-pill{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 18px;border-radius:99px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(168,85,247,.35);
  font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:rgba(245,243,255,.7);transition:all .3s;
}
.status-pill .dot{
  width:8px;height:8px;border-radius:50%;background:#a855f7;
  box-shadow:0 0 10px currentColor;
}
.status-pill.ready{border-color:rgba(255,215,0,.65);color:#ffd700}
.status-pill.ready .dot{background:#ffd700;animation:dotPulse 1.6s infinite}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.7}
}
.status-pill.spinning{border-color:rgba(168,85,247,.75);color:#c4b5fd}
.status-pill.spinning .dot{background:#c4b5fd;animation:blink .5s infinite}
.status-pill.won{border-color:rgba(34,197,94,.85);color:#22c55e}
.status-pill.won .dot{background:#22c55e;box-shadow:0 0 14px #22c55e}
.status-pill.lost{border-color:rgba(239,68,68,.75);color:#ef4444}
.status-pill.lost .dot{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ───── RESULT OVERLAY ───── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;animation:fadeIn .4s ease;
}
.overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.ov-card{
  position:relative;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,215,0,.2) 0%,transparent 50%),
    linear-gradient(160deg,rgba(50,25,90,.99),rgba(10,5,25,.99));
  border:2px solid rgba(255,215,0,.6);
  border-radius:28px;padding:32px 24px;
  max-width:420px;width:100%;text-align:center;
  box-shadow:
    0 30px 90px rgba(0,0,0,.95),
    0 0 100px rgba(255,215,0,.35),
    inset 0 1px 0 rgba(255,255,255,.2);
  animation:pop .5s cubic-bezier(.5,1.6,.5,1);
  overflow:hidden;
}
.ov-card::before{
  content:"";position:absolute;inset:-2px;border-radius:28px;padding:2px;
  background:linear-gradient(180deg,rgba(255,215,0,.8),transparent 40%,transparent 60%,rgba(255,215,0,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

.ov-title{
  font-size:26px;font-weight:900;letter-spacing:6px;
  margin-bottom:8px;text-transform:uppercase;
}
.ov-title.win{
  color:#ffd700;
  text-shadow:0 0 24px rgba(255,215,0,.8),0 0 48px rgba(255,215,0,.4);
}
.ov-title.lose{color:#ef4444;text-shadow:0 0 20px rgba(239,68,68,.7)}

.ov-sub{
  font-size:10px;letter-spacing:4px;color:rgba(245,243,255,.55);
  font-weight:700;margin-bottom:22px;text-transform:uppercase;
}
.ov-reward{
  font-size:52px;font-weight:900;
  font-variant-numeric:tabular-nums;
  margin:8px 0 26px;
  letter-spacing:-1px;
}
.ov-reward.positive{
  background:linear-gradient(180deg,#fff8b8,#ffd700 40%,#b8860b 70%,#ffd700 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 24px rgba(255,215,0,.75));
}
.ov-reward.zero{color:#6b7280;font-size:32px}

.ov-label{
  font-size:9px;letter-spacing:5px;color:rgba(34,211,238,.9);
  font-weight:800;margin-bottom:12px;text-transform:uppercase;
}
.ov-cmd{
  background:rgba(0,0,0,.8);
  border:2px solid rgba(34,211,238,.6);
  border-radius:16px;padding:18px 14px;
  font-family:'JetBrains Mono','Courier New',monospace;
  font-size:18px;font-weight:900;color:#22d3ee;letter-spacing:4px;
  user-select:all;-webkit-user-select:all;
  margin-bottom:12px;
  text-shadow:0 0 14px rgba(34,211,238,.9);
  word-break:break-all;
  box-shadow:0 0 30px rgba(34,211,238,.15) inset;
}
.ov-ttl{
  font-size:11px;color:rgba(245,243,255,.65);
  margin-bottom:20px;font-weight:700;letter-spacing:1px;
}
.ov-ttl b{color:#ffd700;font-size:15px;text-shadow:0 0 10px rgba(255,215,0,.7)}

.ov-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,#ffe97a,#ffd700 25%,#b8860b 60%,#6b4400 100%);
  border:none;border-radius:16px;padding:16px 20px;
  color:#1a0d00;font-size:13px;font-weight:900;
  cursor:pointer;font-family:inherit;
  letter-spacing:3px;text-transform:uppercase;
  box-shadow:
    0 10px 30px rgba(255,215,0,.5),
    inset 0 2px 0 rgba(255,255,255,.5),
    inset 0 -3px 0 rgba(0,0,0,.35);
  transition:all .15s ease;
}
.ov-btn:active{transform:translateY(2px) scale(.98)}
.ov-btn.copied{
  background:linear-gradient(180deg,#5cff9d,#22c55e 40%,#15803d 100%);
  color:#fff;
}
.ov-btn:disabled{
  background:linear-gradient(180deg,#333,#1a1a1a);
  color:#666;box-shadow:none;cursor:not-allowed;
}
.ov-hint{
  font-size:10px;color:rgba(245,243,255,.5);
  margin-top:18px;line-height:1.8;letter-spacing:.5px;
}

/* coin burst particles */
.coin{
  position:fixed;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff8b8 0%,#ffd700 50%,#b8860b 100%);
  box-shadow:0 0 12px rgba(255,215,0,.9),inset 0 0 4px rgba(255,255,255,.6);
  pointer-events:none;z-index:150;
  animation:coinFall 2.4s cubic-bezier(.3,.6,.6,1) forwards;
}
@keyframes coinFall{
  0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) rotate(720deg) scale(.3);opacity:0}
}
</style>
</head>
<body>
<div class="box">
  <div class="machine">
    <div class="marquee" id="marquee"></div>
    <div class="machine-inner">

      <div class="header">
        <div class="eyebrow">Ari Arcade</div>
        <div class="title">Daily Spin</div>
        <div class="sub">Fortune favors the bold</div>
      </div>

      <div class="cabinet">
        <div class="payline" id="payline"></div>
        <div class="reels">
          <div class="reel"><div class="strip" id="s0"></div><div class="reel-sheen"></div></div>
          <div class="reel"><div class="strip" id="s1"></div><div class="reel-sheen"></div></div>
          <div class="reel"><div class="strip" id="s2"></div><div class="reel-sheen"></div></div>
        </div>
      </div>

      <div class="spin-wrap">
        <button class="spin-btn" id="spinBtn">Spin</button>
      </div>

      <div class="status">
        <div class="status-pill ready" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
      </div>

    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden">
  <div class="ov-card">
    <div class="ov-title" id="ovTitle">Result</div>
    <div class="ov-sub" id="ovSub">Ari Daily</div>
    <div class="ov-reward" id="ovReward">+0</div>
    <div class="ov-label">Copy This Command</div>
    <div class="ov-cmd" id="ovCmd">.claim ------</div>
    <div class="ov-ttl">Expires in <b id="ovTtl">0</b>s</div>
    <button class="ov-btn" id="ovCopy">Copy Command</button>
    <div class="ov-hint">Paste it in chat and send. Coins go straight to your wallet.</div>
  </div>
</div>

<script>
(function(){
"use strict";

/* SHARED SECRET — must match the bot */
var SECRET = "ari-daily-2026-xitexe-frontier";

/* ── SYMBOLS (premium look) ── */
var SYM = {
  seven:   '<svg viewBox="0 0 100 100"><defs><linearGradient id="g7" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff8b8"/><stop offset=".5" stop-color="#ffd700"/><stop offset="1" stop-color="#b8860b"/></linearGradient><filter id="f7"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><text x="50" y="80" text-anchor="middle" font-size="92" font-weight="900" font-family="Arial Black,Arial" fill="url(#g7)" stroke="#5a3a00" stroke-width="2.5" filter="url(#f7)">7</text></svg>',
  diamond: '<svg viewBox="0 0 100 100"><defs><linearGradient id="gd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0fbff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0369a1"/></linearGradient><linearGradient id="gds" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><polygon points="50,6 94,50 50,94 6,50" fill="url(#gd)" stroke="#fff" stroke-width="2.5"/><polygon points="50,6 50,50 94,50" fill="url(#gds)"/><polygon points="50,20 78,50 50,80 22,50" fill="#fff" opacity=".15"/></svg>',
  star:    '<svg viewBox="0 0 100 100"><defs><linearGradient id="gs" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fef3ff"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#6b21a8"/></linearGradient></defs><polygon points="50,4 62,38 98,38 69,60 80,96 50,74 20,96 31,60 2,38 38,38" fill="url(#gs)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>',
  bell:    '<svg viewBox="0 0 100 100"><defs><linearGradient id="gb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fef9c3"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#a16207"/></linearGradient></defs><path d="M50 6 Q26 6 26 42 L16 72 L84 72 L74 42 Q74 6 50 6 Z" fill="url(#gb)" stroke="#7a4f00" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="50" cy="72" rx="38" ry="4" fill="#7a4f00"/><circle cx="50" cy="84" r="7" fill="url(#gb)" stroke="#7a4f00" stroke-width="2"/><path d="M50 10 Q36 10 34 40" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/></svg>',
  clover:  '<svg viewBox="0 0 100 100"><defs><radialGradient id="gc" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></radialGradient></defs><g stroke="#052e16" stroke-width="2"><circle cx="34" cy="34" r="20" fill="url(#gc)"/><circle cx="66" cy="34" r="20" fill="url(#gc)"/><circle cx="34" cy="66" r="20" fill="url(#gc)"/><circle cx="66" cy="66" r="20" fill="url(#gc)"/><rect x="47" y="46" width="6" height="48" fill="#166534"/></g><circle cx="29" cy="29" r="5" fill="#fff" opacity=".5"/></svg>'
};
var KEYS = ["seven","diamond","star","bell","clover"];
var SYM_H = 140;
var VISIBLE = 3;              // 3 symbols tall
var BUCKET_MS = 30000;

/* ── CODE ── */
function rotCode(reward){
  var bucket = Math.floor(Date.now() / BUCKET_MS);
  var str = SECRET + ":" + bucket + ":" + reward;
  var h = 0x811c9dc5 >>> 0;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return String(h % 1000000).padStart(6, "0");
}
function pickSymbol(){
  var r = Math.random();
  if (r < 0.05) return "seven";
  if (r < 0.15) return "diamond";
  if (r < 0.30) return "star";
  if (r < 0.55) return "bell";
  return "clover";
}
function computePrize(s){
  if (s[0] === s[1] && s[1] === s[2]) {
    return {seven:1000, diamond:500, star:250, bell:150, clover:100}[s[0]];
  }
  if (s[0] === s[1] || s[1] === s[2] || s[0] === s[2]) return 50;
  return 0;
}

/* ── RENDER HELPERS ── */
function buildSymHTML(key){ return '<div class="sym">' + SYM[key] + '</div>'; }

function fillIdleStrip(el){
  var html = "";
  for (var i = 0; i < VISIBLE + 4; i++) {
    html += buildSymHTML(KEYS[Math.floor(Math.random() * KEYS.length)]);
  }
  el.innerHTML = html;
  el.style.transform = "translateY(" + (-SYM_H) + "px)";
  el.classList.remove("fast","spinning");
}

/* ── SPIN ONE REEL (with motion blur + bounce) ── */
function spinReel(el, target, durationMs, onDone){
  var preSpins = 22;
  var html = "";

  // pre-roll: random symbols, aligned so center = random
  // Actually: build a long strip with final symbol placed so that when we translate
  // by -(preSpins * SYM_H) it lands in the middle row (row index 1 of viewport)
  // The strip layout: [pre, pre, ... pre, final]
  // The viewport shows 2 symbols tall with payline in center.
  // We want the target to sit exactly on the payline (row 1 of 3 visible rows).
  // Simplest: place target at index preSpins, translate so index preSpins lands in center.

  // Build: [random * preSpins] + [target]
  for (var i = 0; i < preSpins; i++) {
    html += buildSymHTML(KEYS[Math.floor(Math.random() * KEYS.length)]);
  }
  // We want the target to end at the CENTER of the viewport.
  // Reel viewport is 280px tall. Each symbol is 140px. Center = 140px down.
  // If we place target at index N, we translate strip up by N*140 px to bring it to top,
  // then we need to push it down 140px so it sits at 140px (center). So translateY = -(N*140) + 140
  // Actually with a 2-row viewport (280px = 2 * 140), the center of viewport is at 140px.
  // For a symbol to be centered, its top must be at 140 - 70 = 70px from reel top.
  // Let's just center on symbol index N by translating -(N*140 - 70).
  // Wait, symbol heights are 140. So symbol at index N starts at y=N*140.
  // To center it: y_center_of_viewport (140) should equal N*140 + 70.
  // => translateY = 140 - (N*140 + 70) = 70 - N*140
  // So we translate strip by (70 - N*140) px from top.

  // Final index = preSpins (the target we appended)
  var targetIndex = preSpins;
  html += buildSymHTML(target);

  // Add 1 more below so there's content under the target
  html += buildSymHTML(KEYS[Math.floor(Math.random() * KEYS.length)]);

  el.innerHTML = html;

  // Reset without animation
  el.style.transition = "none";
  el.style.transform = "translateY(70px)";
  el.classList.remove("fast","spinning");
  el.offsetHeight;

  // Spin! Motion blur for the first part, then decelerate
  el.classList.add("fast");
  el.style.transition = "transform " + durationMs + "ms cubic-bezier(.15,.55,.25,1), filter " + (durationMs/2) + "ms ease-out";
  el.style.transform = "translateY(" + (70 - targetIndex * SYM_H) + "px)";

  // Remove blur in second half for a smooth settle
  setTimeout(function(){ el.classList.remove("fast"); el.classList.add("spinning"); }, durationMs * 0.55);
  setTimeout(function(){
    el.classList.remove("spinning");
    if (onDone) onDone();
  }, durationMs + 60);
}

/* ── MARQUEE LIGHTS ── */
function buildMarquee(){
  var m = document.getElementById("marquee");
  var count = 26;
  var html = "";
  // top + bottom rows
  for (var i = 0; i < count; i++) {
    var pct = (i / (count - 1)) * 100;
    html += '<span class="bulb" style="top:6px;left:' + pct + '%;animation-delay:' + (i * 0.08) + 's"></span>';
    html += '<span class="bulb" style="bottom:6px;left:' + pct + '%;animation-delay:' + (i * 0.08) + 's"></span>';
  }
  m.innerHTML = html;
}

/* ── ELEMENTS ── */
var s0 = document.getElementById("s0");
var s1 = document.getElementById("s1");
var s2 = document.getElementById("s2");
var spinBtn = document.getElementById("spinBtn");
var statusEl = document.getElementById("status");
var statusText = document.getElementById("statusText");
var overlay = document.getElementById("overlay");
var ovTitle = document.getElementById("ovTitle");
var ovSub = document.getElementById("ovSub");
var ovReward = document.getElementById("ovReward");
var ovCmd = document.getElementById("ovCmd");
var ovTtl = document.getElementById("ovTtl");
var ovCopy = document.getElementById("ovCopy");
var payline = document.getElementById("payline");

var spinning = false, done = false;
var frozenCode = null, frozenAt = 0;

buildMarquee();
fillIdleStrip(s0);
fillIdleStrip(s1);
fillIdleStrip(s2);

function setStatus(text, cls){
  statusText.textContent = text;
  statusEl.className = "status-pill " + (cls || "");
}

/* ── COIN BURST ── */
function coinBurst(originX, originY, count){
  for (var i = 0; i < count; i++) {
    (function(){
      var coin = document.createElement("div");
      coin.className = "coin";
      coin.style.left = originX + "px";
      coin.style.top = originY + "px";
      var tx = (Math.random() - .5) * 400;
      var ty = -(Math.random() * 300 + 200);
      coin.style.setProperty("--tx", tx + "px");
      coin.style.setProperty("--ty", ty + "px");
      coin.style.animationDelay = (Math.random() * 0.15) + "s";
      document.body.appendChild(coin);
      setTimeout(function(){ coin.remove(); }, 2600);
    })();
  }
}

/* ── SPIN ── */
spinBtn.addEventListener("click", function(){
  if (spinning || done) return;
  spinning = true;
  spinBtn.disabled = true;
  spinBtn.classList.add("spinning");
  spinBtn.textContent = "SPINNING";
  setStatus("Spinning", "spinning");
  payline.classList.remove("active");

  var result = [pickSymbol(), pickSymbol(), pickSymbol()];
  var doneCount = 0;
  var durs = [2200, 2600, 3000];

  function reelDone(){
    doneCount++;
    if (doneCount === 3) {
      finish();
    }
  }

  spinReel(s0, result[0], durs[0], reelDone);
  spinReel(s1, result[1], durs[1], reelDone);
  spinReel(s2, result[2], durs[2], reelDone);

  function finish(){
    var prize = computePrize(result);
    frozenCode = rotCode(prize);
    frozenAt = Date.now();

    done = true;
    spinning = false;
    spinBtn.classList.remove("spinning");
    spinBtn.textContent = "SPIN USED";
    spinBtn.disabled = true;

    // highlight winning symbols
    var strips = [s0, s1, s2];
    if (prize > 0) {
      setStatus("Winner!", "won");
      payline.classList.add("active");
      strips.forEach(function(strip){
        var syms = strip.querySelectorAll(".sym");
        var idx = Math.floor(parseFloat(getComputedStyle(strip).transform.split(",")[5]) * -1 / SYM_H) - 1;
        // fallback: highlight all, minor detail
        strip.querySelectorAll(".sym").forEach(function(symEl, i){
          if (i === syms.length - 2) symEl.classList.add("win");
        });
      });
      // coin burst from payline center
      var rect = payline.getBoundingClientRect();
      coinBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);
    } else {
      setStatus("No win", "lost");
    }

    setTimeout(function(){
      ovTitle.textContent = prize > 0 ? "You Won" : "No Luck";
      ovTitle.className = "ov-title " + (prize > 0 ? "win" : "lose");
      ovReward.textContent = prize > 0 ? ("+" + prize) : "NOTHING";
      ovReward.className = "ov-reward " + (prize > 0 ? "positive" : "zero");
      ovCmd.textContent = ".claim " + frozenCode;
      overlay.classList.remove("hidden");
    }, 600);

    var bucketStart = Math.floor(frozenAt / BUCKET_MS) * BUCKET_MS;
    var validUntil = bucketStart + BUCKET_MS * 3;
    (function tick(){
      var left = Math.max(0, Math.floor((validUntil - Date.now()) / 1000));
      ovTtl.textContent = left;
      if (left <= 0) {
        ovTtl.textContent = "0";
        ovCopy.disabled = true;
        ovCopy.textContent = "Code Expired";
        return;
      }
      setTimeout(tick, 500);
    })();
  }
});

/* ── COPY ── */
ovCopy.addEventListener("click", function(){
  if (!frozenCode) return;
  var cmd = ".claim " + frozenCode;
  var doneCb = function(){
    ovCopy.classList.add("copied");
    ovCopy.textContent = "Copied!";
    setTimeout(function(){
      ovCopy.classList.remove("copied");
      ovCopy.textContent = "Copy Command";
    }, 1800);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(doneCb).catch(function(){
        var ta = document.createElement("textarea");
        ta.value = cmd; ta.style.position = "fixed"; ta.style.top = "-9999px";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch(e){}
        document.body.removeChild(ta); doneCb();
      });
    } else {
      var ta = document.createElement("textarea");
      ta.value = cmd; ta.style.position = "fixed"; ta.style.top = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); doneCb();
    }
  } catch(e){}
});
})();
</script>
